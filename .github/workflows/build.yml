name: Build

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -ntp clean verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: xtxsMaceControl
          path: target/xtxsMaceControl.jar
          if-no-files-found: error
