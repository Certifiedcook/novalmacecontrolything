name: Build

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Build
        run: mvn -B -ntp clean verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: xtxsMaceControl-paper-26.2
          path: target/xtxsMaceControl.jar
          if-no-files-found: error
